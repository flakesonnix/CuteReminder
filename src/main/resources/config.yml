# TemplatePlugin — database config
# type: sqlite | mysql | postgresql
# sqlite = zero-setup file DB (default). good for single-server.
# mysql/postgresql = for networked / bungee / velocity setups.

database:
  type: sqlite

  # pool — HikariCP
  pool:
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000

  sqlite:
    # relative to plugins/TemplatePlugin/  or absolute path
    file: database.db

  mysql:
    host: localhost
    port: 3306
    database: minecraft
    user: root
    password: "change_me"
    params: "useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8mb4&serverTimezone=UTC"

  postgresql:
    host: localhost
    port: 5432
    database: minecraft
    user: postgres
    password: "change_me"
    params: "sslmode=disable"

# ping cmd — store history?
ping:
  save-history: true
  # keep only last N per player? 0 = keep all
  max-history-per-player: 1000
